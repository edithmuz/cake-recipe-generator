<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style.css" />
    <script src="https://unpkg.com/typewriter-effect@latest/dist/core.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.13.2/dist/axios.min.js"></script>
    <title>AI Cake Recipe Generator</title>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>AI Cake Recipe Generator</h1>
      </header>

      <main>
        <form id="recipe-generator-form">
          <input
            type="text"
            placeholder="Enter the type of cake"
            autofocus
            required
            autocomplete="off"
            class="instruction"
            id="user-request"
          />
          <input type="submit" class="submit-button" />
        </form>
        <div class="recipe" id="recipe"></div>
      </main>
      <footer>
        This AI project was coded by
        <a href="https://github.com/edithmuz/"> Edith Muzah</a> and is
        <a
          href="https://github.com/edithmuz/cake-recipe-generator"
          target="_blank"
          >open-sourced on GitHub</a
        >
        and is
        <a
          href="https://app.netlify.com/projects/ai-cake-recipe-generator/overview"
          target="_blank"
          >hosted on Netlify.</a
        >
      </footer>
    </div>
    <script src="src/script.js"></script>
  </body>
</html>
